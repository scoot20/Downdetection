name: Payroll outage monitor

on:
  schedule:
    - cron: "3-58/5 * * * *"   # every 5 minutes, offset from :00/:05 to dodge congestion
  workflow_dispatch:            # "Run workflow" button = test mode

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor.py ${{ github.event_name == 'workflow_dispatch' && '--test' || '' }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update monitor state" && git push)
